# Контекст http (ставится в /etc/nginx/conf.d/ скриптом install-media-proxy.sh).
# Кэш файлов, полученных из бакета B2 для oilgascity.ru/oilgascity-media/.
proxy_cache_path /var/cache/nginx/oilgascity-media levels=1:2 keys_zone=oilgascity_media:10m
                 max_size=5g inactive=60d use_temp_path=off;

# Ключ объекта в бакете из исходного адреса запроса: $request_uri ещё закодирован, поэтому
# имена с кириллицей и пробелами уходят в хранилище без повторного кодирования
map $request_uri $oilgascity_media_key {
    ~^/oilgascity-media/([^?]*)  $1;
    default                      "";
}
